apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-ingress
  namespace: sgc
spec:
  podSelector:
    matchLabels:
      app: gateway-ops-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000