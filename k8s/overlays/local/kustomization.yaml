apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Kind runs from a locally loaded image; if tag isn't present, fail loudly
patches:
  - target:
      kind: Deployment
      name: gate-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent