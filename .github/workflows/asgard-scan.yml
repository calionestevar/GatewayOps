# asgard-scan.yml
# The Asgard (SG-1) - advanced allies whose technology exceeds our own.
# Four independent sensors, four threat classes:
#   gitleaks - did a credential leak into the repository?
#   hadolint - does the Dockerfile violate container build practice?
#   checkov  - does the Terraform violate cloud hardening policy?
#   trivy    - does the built image carry known CVEs?
#
# Note: gitleaks runs via its container image rather than gitleaks-action,
# which does not support the workflow_run trigger. Table output goes to the
# job log instead of SARIF - code scanning upload is unreliable under
# workflow_run contexts and v3 of the uploader is deprecated.

name: Asgard Scan

on:
  workflow_run:
    workflows: ["ZPM Build"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gateway-ops-app
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

permissions:
  contents: read
  packages: read

jobs:
  asgard-scan:
    name: Asgard Scan (four sensors)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit the build scanned - workflow_run
          # would otherwise check out the default branch head
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            zricethezav/gitleaks:latest detect \
            --source /src \
            --no-banner \
            --redact \
            --verbose

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: IaC policy scan (checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV2_AWS_11,CKV2_AWS_12  # Deferred until migration phase

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'