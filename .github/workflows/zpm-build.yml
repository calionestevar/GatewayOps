# zpm-build.yml
# Atlantis ZPM (Zero Point Module) = power source that energizes the build.
# Builds with provenance, verifies it, and publishes to GHCR for
# downstream workflows to launch.

name: ZPM Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gateway-ops-app
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  zpm-build:
    name: ZPM Build (energize)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with provenance
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            PACKAGE_NAME=gateway-ops
            BUILD_NUMBER=${{ github.run_number }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify provenance burned into image
        run: |
          docker run --rm -d -p 5000:5000 --name zpm-check ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 5
          RESPONSE=$(curl -sf http://localhost:5000/version)
          echo "$RESPONSE" | jq .
          EXPECTED="gateway-ops/${{ env.IMAGE_TAG }} (${{ github.sha }})"
          ACTUAL=$(echo "$RESPONSE" | jq -r '.user_agent')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Provenance mismatch. Expected [$EXPECTED], got [$ACTUAL]"
            docker stop zpm-check
            exit 1
          fi
          echo "Provenance verified: $ACTUAL"
          docker stop zpm-check

      - name: Push to GHCR
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}