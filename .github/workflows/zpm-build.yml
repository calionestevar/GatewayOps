# zpm-build.yml
# Atlantis ZPM (Zero Point Module) = power source that energizes the build.
# Builds with provenance, verifies the contract, and publishes to GHCR.
#
# Provenance values are defined ONCE in workflow-level env and consumed by
# both the build args and the verification assertion. Duplicating them
# caused a drift bug during the SHA-tag migration.

name: ZPM Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gateway-ops-app
  IMAGE_TAG: ${{ github.sha }}
  # --- Provenance contract: <package>/<build> (<sha>) ---
  PACKAGE_NAME: gateway-ops
  BUILD_NUMBER: ${{ github.run_number }}
  COMMIT_SHA: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  zpm-build:
    name: ZPM Build (energize)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/

      - name: Unit tests with coverage
        run: |
          pip install -r app/requirements.txt -r app/requirements-dev.txt
          export PYTHONPATH=$PWD:$PYTHONPATH
          pytest app/tests/ \
            --cov=app.app \
            --cov-report=term-missing \
            --cov-report=json:coverage.json

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.json ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage data — test run failed before reporting." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PCT=$(jq -r '.totals.percent_covered_display' coverage.json)
          COVERED=$(jq -r '.totals.covered_lines' coverage.json)
          TOTAL=$(jq -r '.totals.num_statements' coverage.json)

          {
            echo "### Unit Test Coverage"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Line coverage | ${PCT}% |"
            echo "| Lines covered | ${COVERED} / ${TOTAL} |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint workflows (actionlint)
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Build image with provenance
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            PACKAGE_NAME=${{ env.PACKAGE_NAME }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify provenance burned into image
        run: |
          docker run --rm -d -p 5000:5000 --name zpm-check \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          # Poll rather than fixed sleep - container startup time varies
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/version >/dev/null 2>&1 && break
            sleep 1
          done

          RESPONSE=$(curl -sf http://localhost:5000/version)
          echo "$RESPONSE" | jq .

          # Single source of truth: same env vars that fed the build args
          EXPECTED="${PACKAGE_NAME}/${BUILD_NUMBER} (${COMMIT_SHA})"
          ACTUAL=$(echo "$RESPONSE" | jq -r '.user_agent')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Provenance mismatch."
            echo "::error::  expected: [$EXPECTED]"
            echo "::error::  observed: [$ACTUAL]"
            docker stop zpm-check
            exit 1
          fi

          # Assert the individual fields too - catches partial threading
          # (e.g. Dockerfile passes PACKAGE_NAME but drops COMMIT_SHA)
          for field in package build_number commit_sha; do
            OBSERVED=$(echo "$RESPONSE" | jq -r ".${field}")
            case "$field" in
              package)      WANT="$PACKAGE_NAME" ;;
              build_number) WANT="$BUILD_NUMBER" ;;
              commit_sha)   WANT="$COMMIT_SHA" ;;
            esac
            if [ "$OBSERVED" != "$WANT" ]; then
              echo "::error::Field '${field}' mismatch: expected [${WANT}], observed [${OBSERVED}]"
              docker stop zpm-check
              exit 1
            fi
          done

          echo "Provenance verified: $ACTUAL"
          docker stop zpm-check

      - name: Push to GHCR
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}