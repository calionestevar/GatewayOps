# prometheus-launch.yml
# X-303 Prometheus = Earth's flagship on its maiden launch.
# Pulls the verified image from GHCR, deploys to an ephemeral Kind
# cluster, and runs SGC smoke tests before the wormhole closes.

name: Prometheus Launch

on:
  workflow_run:
    workflows: ["ZPM Build"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gateway-ops-app

permissions:
  contents: read
  packages: read

jobs:
  prometheus-launch:
    name: Prometheus Launch (maiden voyage)
    # Only launch if the build succeeded - the Iris stays closed otherwise
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.run_number }}

      - name: Create ephemeral cluster (Atlantis rises)
        uses: helm/kind-action@v1
        with:
          cluster_name: gateway-ops-ci
          config: .github/kind-config.yaml

      - name: Load image into Kind
        run: |
          kind load docker-image ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.run_number }} --name gateway-ops-ci

      - name: Patch image tag for CI deploy
        run: |
          cd k8s
          kustomize edit set image gateway-ops-app=${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.run_number }} || \
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.run_number }}|" gate-deployment.yaml

      - name: Launch through the gate (deploy via Kustomize)
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/gate-deployment -n sgc --timeout=120s

      - name: SGC Smoke Tests (shared suite - same as local)
        run: |
          kubectl port-forward svc/gate-service 8080:80 -n sgc &
          PORT_FORWARD_PID=$!
          sleep 5
          EXPECTED_BUILD=${{ github.event.workflow_run.run_number }} \
            BASE_URL=http://localhost:8080 \
            bash scripts/sgc-smoke.sh
          RESULT=$?
          kill $PORT_FORWARD_PID
          exit $RESULT

      - name: Post-failure forensics
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n sgc -o wide || true
          echo "=== Pod logs ==="
          kubectl logs -l app=gateway-ops-app -n sgc --tail=50 || true
          echo "=== Events ==="
          kubectl get events -n sgc --sort-by=.lastTimestamp | tail -20 || true