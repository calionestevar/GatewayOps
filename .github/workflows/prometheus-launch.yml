# prometheus-launch.yml
# X-303 Prometheus = Earth's flagship on its maiden launch.
# Pulls the verified image from GHCR, deploys to an ephemeral Kind
# cluster, and runs SGC smoke tests before the wormhole closes.

name: Prometheus Launch

on:
  workflow_run:
    workflows: ["Asgard Scan"]
    types: [completed]
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gateway-ops-app

permissions:
  contents: read
  packages: read

jobs:
  prometheus-launch:
    name: Prometheus Launch (maiden voyage)
    # Only launch if the build succeeded - the Iris stays closed otherwise
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}

      - name: Create ephemeral cluster (Atlantis rises)
        uses: helm/kind-action@v1
        with:
          cluster_name: gateway-ops-ci
          config: .github/kind-config.yaml

      - name: Load image into Kind
        run: |
          kind load docker-image ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }} --name gateway-ops-ci

      - name: Patch image tag for CI deploy
        run: |
          cd k8s/overlays/ci
          kustomize edit set image \
            gateway-ops-app=${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          echo "--- resulting kustomization.yaml ---"
          cat kustomization.yaml

      - name: Lantean Shield (rendered manifest hardening)
        run: |
          chmod +x scripts/lantean-shield.sh
          OVERLAY=k8s/overlays/ci DEBUG=1 bash scripts/lantean-shield.sh
        env:
          DEBUG: "1"

      - name: Launch through the gate (deploy via Kustomize)
        run: |
          kubectl apply -k k8s/overlays/ci/
          kubectl rollout status deployment/gate-deployment -n sgc --timeout=120s

      - name: SGC Smoke Tests (with extended stabilization)
        run: |
          kubectl port-forward svc/gate-service 8080:80 -n sgc &
          PORT_FORWARD_PID=$!
          
          # Poll until health endpoint responds
          echo "Waiting for gateway to become healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
              echo "Gateway healthy after $i seconds"
              break
            fi
            sleep 2
          done
          
          EXPECTED_SHA=${{ github.event.workflow_run.head_sha }} \
            BASE_URL=http://localhost:8080 \
            bash scripts/sgc-smoke.sh
          
          RESULT=$?
          kill $PORT_FORWARD_PID
          exit $RESULT

      - name: Post-failure forensics
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n sgc -o wide || true
          echo "=== Pod logs ==="
          kubectl logs -l app=gateway-ops-app -n sgc --tail=50 || true
          echo "=== Events ==="
          kubectl get events -n sgc --sort-by=.lastTimestamp | tail -20 || true